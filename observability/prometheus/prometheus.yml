# Prometheus scrape configuration for the analyzer's observability stack.
# All targets are reached over the app's `backend` docker network.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus scraping itself.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Per-container CPU / memory / network for EVERY service (language-agnostic).
  # Feeds Layer-1 utilization and helps detect failures/restarts.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Kong gateway metrics (per-route request rate, latency, status codes) from
  # the Kong Prometheus plugin, served on the admin API. Because all traffic
  # flows through Kong, this alone gives per-service arrival rate + latency.
  - job_name: kong
    metrics_path: /metrics
    static_configs:
      - targets: ["api-gateway:8001"]

  # Metrics forwarded by the OpenTelemetry Collector (this brings in Beyla's
  # eBPF-derived RED metrics).
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
